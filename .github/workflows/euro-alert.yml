name: euro-alert

on:
  schedule:
    # 10분마다 (정각은 지연이 심해서 7분씩 밀어둠)
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: # Actions 탭 수동 실행 버튼

permissions:
  contents: write # state.json 커밋용

concurrency:
  group: euro-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 환율 확인
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TARGET_RATE: "1640" # ← 기준 환율. 여기 숫자만 바꾸면 됨
          STEP_WON: "1" # ← 추가 알림 간격(원)
        run: python check_rate.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
