name: euro-alert

on:
  schedule:
    # 백업용. 실제 5분 주기는 cron-job.org 가 workflow_dispatch 로 담당한다.
    # 외부 크론이 죽어도 최소 1시간에 한 번은 돌게 하는 안전망.
    - cron: "23 * * * *"
  workflow_dispatch: # 외부 크론 + Actions 탭 수동 실행

permissions:
  contents: write # state.json 커밋용

concurrency:
  group: euro-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 환율 확인
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ↓ 아래 둘은 "최초 1회" 초기값. 이후에는 텔레그램 /target 으로 변경
          TARGET_RATE: "1640"
          STEP_WON: "1"
          # ↓ 급락 감지 기준
          PLUNGE_WON: "3"
          PLUNGE_MINUTES: "30"
        run: python check_rate.py

      - name: 상태 저장
        if: always() # 실패해도 장애 기록은 남긴다
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push 재시도 $i"
              sleep 5
            done
          fi
