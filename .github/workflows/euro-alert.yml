name: euro-alert

on:
  schedule:
    # 10분마다 (정각은 지연이 심해서 7분씩 밀어둠)
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: # Actions 탭 수동 실행 버튼

permissions:
  contents: write # state.json 커밋용

concurrency:
  group: euro-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 환율 확인
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ↓ 아래 둘은 "최초 1회" 초기값. 이후에는 텔레그램 /target 으로 변경
          TARGET_RATE: "1640"
          STEP_WON: "1"
          # ↓ 급락 감지 기준
          PLUNGE_WON: "3"
          PLUNGE_MINUTES: "30"
        run: python check_rate.py

      - name: 상태 저장
        if: always() # 실패해도 장애 기록은 남긴다
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
